<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Achievements</title>
<style>
  :root {
    --bg: #0a0c12;
    --panel: #12151f;
    --panel-2: #171b28;
    --line: #242a3a;
    --text: #e7eaf3;
    --muted: #8f98b2;
    --dim: #5d6580;
    --accent: #7c9cff;
    --steam: #66c0f4;
    --xbox: #9bf00b;
    --gold: #ffc857;
    --radius: 12px;
    --sidebar: 340px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  button, input, select { font: inherit; color: inherit; }

  /* ---------------- Sign in ---------------- */

  #gate {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2136, var(--bg));
    z-index: 50;
  }

  /* An ID selector outranks the browser's [hidden] rule, so display:grid above
     would otherwise keep the overlay on screen after a successful sign-in. */
  #gate[hidden] { display: none; }

  .gate-card {
    width: min(380px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
    text-align: center;
  }

  .gate-card h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.01em; }
  .gate-card p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }

  .gate-card input {
    width: 100%;
    padding: 11px 13px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
  }
  .gate-card input:focus { border-color: var(--accent); }

  .btn {
    background: var(--accent);
    color: #0a0c12;
    border: 0;
    border-radius: 10px;
    padding: 11px 16px;
    font-weight: 650;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: .55; cursor: default; }

  .gate-card .btn { width: 100%; margin-top: 12px; }

  .error {
    color: #ff8080;
    font-size: 13px;
    min-height: 18px;
    margin-top: 10px;
  }

  /* ---------------- Shell ---------------- */

  #app { display: none; height: 100%; flex-direction: column; }
  #app.on { display: flex; }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }

  .brand {
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .brand span { color: var(--dim); font-weight: 500; }

  .totals {
    display: flex;
    gap: 18px;
    margin-left: auto;
    align-items: center;
    white-space: nowrap;
  }

  .stat { text-align: right; line-height: 1.15; }
  .stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .stat i { font-style: normal; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }

  .linkish {
    background: none;
    border: 0;
    color: var(--dim);
    cursor: pointer;
    font-size: 13px;
    padding: 6px;
  }
  .linkish:hover { color: var(--text); }

  main {
    display: grid;
    grid-template-columns: var(--sidebar) 1fr;
    flex: 1;
    min-height: 0;
  }

  /* ---------------- Sidebar ---------------- */

  #sidebar {
    border-right: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .filters { padding: 12px; border-bottom: 1px solid var(--line); flex: none; }

  #search {
    width: 100%;
    padding: 9px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }

  .chips { display: flex; gap: 6px; margin-top: 10px; }

  .chip {
    flex: 1;
    padding: 6px 4px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--panel-2); border-color: var(--accent); color: var(--text); }

  .sort-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--dim); }
  .sort-row select {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    outline: none;
  }

  #games { overflow-y: auto; flex: 1; padding: 6px; }

  .game {
    display: grid;
    grid-template-columns: 46px 1fr;
    gap: 10px;
    align-items: center;
    width: 100%;
    padding: 8px;
    background: none;
    border: 0;
    border-radius: 10px;
    text-align: left;
    cursor: pointer;
  }
  .game:hover { background: var(--panel-2); }
  .game[aria-current="true"] { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }

  .thumb {
    width: 46px;
    height: 46px;
    border-radius: 7px;
    object-fit: cover;
    background: var(--panel-2);
    flex: none;
  }

  .game-name {
    font-size: 13.5px;
    font-weight: 550;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .game-sub {
    font-size: 11.5px;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }

  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .dot.steam { background: var(--steam); }
  .dot.xbox { background: var(--xbox); }

  .mini-bar {
    height: 3px;
    border-radius: 2px;
    background: var(--line);
    margin-top: 5px;
    overflow: hidden;
  }
  .mini-bar > i { display: block; height: 100%; background: var(--accent); }
  .mini-bar.done > i { background: var(--gold); }

  .empty { padding: 28px 16px; color: var(--dim); font-size: 13px; text-align: center; }

  .warn {
    margin: 8px 12px 0;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold);
    border-radius: 8px;
    background: var(--panel-2);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }

  /* ---------------- Detail ---------------- */

  #detail { overflow-y: auto; min-height: 0; }

  .hero {
    position: relative;
    padding: 28px 32px 22px;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }

  .hero-art {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: .17;
    filter: saturate(1.2);
  }
  .hero-art::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,12,18,.45), var(--bg));
  }

  .hero-inner { position: relative; }

  .hero h2 { margin: 0; font-size: clamp(20px, 3vw, 28px); letter-spacing: -0.02em; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .progress-row { display: flex; align-items: center; gap: 20px; margin-top: 16px; flex-wrap: wrap; }

  .bar {
    flex: 1;
    min-width: 180px;
    height: 8px;
    background: var(--line);
    border-radius: 5px;
    overflow: hidden;
  }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #a9c0ff); }
  .bar.done > i { background: linear-gradient(90deg, var(--gold), #ffe0a3); }

  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px 32px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(10,12,18,.9);
    backdrop-filter: blur(8px);
    z-index: 2;
    flex-wrap: wrap;
  }

  .toolbar .chip { flex: none; padding: 6px 12px; }
  .toolbar select {
    margin-left: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    outline: none;
    font-size: 13px;
  }

  #list { padding: 14px 32px 60px; display: flex; flex-direction: column; gap: 8px; }

  .ach {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .ach.locked { opacity: .58; }
  .ach.locked .ach-icon { filter: grayscale(1); }

  .ach-icon {
    width: 56px;
    height: 56px;
    border-radius: 9px;
    object-fit: cover;
    background: var(--panel-2);
  }

  .ach-name { font-weight: 600; font-size: 14.5px; }
  .ach-desc { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .ach-meta {
    text-align: right;
    font-size: 12px;
    color: var(--dim);
    white-space: nowrap;
    line-height: 1.5;
  }
  .ach-meta .date { color: var(--muted); }
  .ach-meta .gs { color: var(--gold); font-weight: 650; font-variant-numeric: tabular-nums; }
  .rarity { font-weight: 650; }
  .r-common { color: var(--dim); }
  .r-uncommon { color: #7fd6a0; }
  .r-rare { color: var(--steam); }
  .r-veryrare { color: #c79bff; }
  .r-ultra { color: #ff9ec4; }

  .secret-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--dim);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 5px;
    margin-left: 8px;
    vertical-align: 1px;
  }

  .notice {
    margin: 16px 32px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold);
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
    font-size: 13px;
  }

  .placeholder {
    height: 100%;
    display: grid;
    place-items: center;
    color: var(--dim);
    text-align: center;
    padding: 40px;
  }

  .spinner {
    width: 22px;
    height: 22px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 40px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .skeleton { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }

  #back { display: none; }

  /* ---------------- Narrow screens ---------------- */

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }

    #sidebar { border-right: 0; }

    /* Master/detail swap: one pane at a time. */
    body.viewing #sidebar { display: none; }
    body:not(.viewing) #detail { display: none; }

    body.viewing #back { display: inline-flex; }

    .totals .stat:nth-child(n+3) { display: none; }
    .hero { padding: 20px 16px 18px; }
    .toolbar { padding: 10px 16px; }
    #list { padding: 12px 16px 60px; }
    .notice { margin: 12px 16px; }

    .ach { grid-template-columns: 44px 1fr; padding: 10px 12px; }
    .ach-icon { width: 44px; height: 44px; }
    .ach-meta { grid-column: 2; text-align: left; margin-top: 2px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .spinner, .skeleton { animation: none; }
  }
</style>
</head>
<body>

<!-- Sign in -->
<div id="gate" hidden>
  <form class="gate-card" id="gate-form">
    <h1>Achievements</h1>
    <p id="gate-msg">Private. Enter the password to continue.</p>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="gate-btn">Sign in</button>
    <div class="error" id="gate-error"></div>
  </form>
</div>

<!-- App -->
<div id="app">
  <header>
    <button class="linkish" id="back" title="Back to games">&larr; Games</button>
    <div class="brand">Achievements <span>&middot; sambonius</span></div>
    <div class="totals" id="totals"></div>
    <button class="linkish" id="signout" title="Sign out">Sign out</button>
  </header>

  <main>
    <aside id="sidebar">
      <div class="filters">
        <input id="search" type="search" placeholder="Search games" autocomplete="off">
        <div class="chips" role="group" aria-label="Platform">
          <button class="chip" data-plat="all" aria-pressed="true">All</button>
          <button class="chip" data-plat="steam" aria-pressed="false">Steam</button>
          <button class="chip" data-plat="xbox" aria-pressed="false">Xbox</button>
        </div>
        <div class="sort-row">
          <label for="sort">Sort</label>
          <select id="sort">
            <option value="recent">Recently played</option>
            <option value="played">Most played</option>
            <option value="name">Name</option>
            <option value="progress">Completion</option>
          </select>
        </div>
      </div>
      <div id="warnings"></div>
      <div id="games"><div class="spinner"></div></div>
    </aside>

    <section id="detail">
      <div class="placeholder" id="placeholder">
        <div>
          <div style="font-size:30px;margin-bottom:8px">&#127942;</div>
          Pick a game to see what you have done.
        </div>
      </div>
    </section>
  </main>
</div>

<script>
"use strict";

var AUTHED = __AUTHED__;
var CONFIGURED = __CONFIGURED__;

var state = {
  games: [],
  warnings: [],
  platform: 'all',
  query: '',
  sort: 'recent',
  selected: null,
  filter: 'all',       // achievement filter within a game
  achSort: 'default',
  cache: {}            // key -> achievement payload, so re-picking a game is instant
};

var $ = function (sel) { return document.querySelector(sel); };

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ---------------- Formatting ---------------- */

function hours(mins) {
  if (!mins) return null;
  if (mins < 60) return mins + ' min';
  return (mins / 60).toFixed(mins < 600 ? 1 : 0) + ' h';
}

function when(ms) {
  if (!ms) return null;
  var d = new Date(ms);
  if (isNaN(d)) return null;
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

function rarityClass(p) {
  if (p == null) return '';
  if (p >= 50) return 'r-common';
  if (p >= 20) return 'r-uncommon';
  if (p >= 10) return 'r-rare';
  if (p >= 5) return 'r-veryrare';
  return 'r-ultra';
}

function pct(n, d) { return d ? Math.round((n / d) * 100) : 0; }

// Xbox reports totalAchievements as 0 on most titles, so fall back to the
// gamerscore totals, which it does report accurately.
function progressOf(g) {
  var s = g.summary;
  if (!s) return null;
  if (s.total) {
    return { percent: pct(s.earned, s.total), label: s.earned + ' / ' + s.total };
  }
  if (s.totalPoints) {
    return {
      percent: pct(s.points || 0, s.totalPoints),
      label: (s.points || 0).toLocaleString() + ' / ' + s.totalPoints.toLocaleString() + ' G'
    };
  }
  if (s.earned) return { percent: null, label: s.earned + ' unlocked' };
  return null;
}

/* ---------------- Sign in ---------------- */

function showGate(message) {
  var gate = $('#gate');
  gate.hidden = false;
  $('#app').classList.remove('on');
  if (message) $('#gate-msg').textContent = message;
  if (!CONFIGURED) {
    $('#gate-msg').textContent = 'This site has no password set yet. Add the SITE_PASSWORD secret to the Worker.';
    $('#password').disabled = true;
    $('#gate-btn').disabled = true;
  } else {
    setTimeout(function () { $('#password').focus(); }, 30);
  }
}

$('#gate-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = $('#gate-btn');
  var err = $('#gate-error');
  btn.disabled = true;
  err.textContent = '';

  fetch('/api/login', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ password: $('#password').value })
  }).then(function (r) {
    return r.json().then(function (b) { return { ok: r.ok, body: b }; });
  }).then(function (res) {
    if (!res.ok) throw new Error(res.body.error || 'Sign in failed.');
    $('#gate').hidden = true;
    start();
  }).catch(function (e2) {
    err.textContent = e2.message;
    $('#password').select();
  }).then(function () {
    btn.disabled = false;
  });
});

$('#signout').addEventListener('click', function () {
  fetch('/api/logout').then(function () { location.reload(); });
});

/* ---------------- Library ---------------- */

function start() {
  $('#app').classList.add('on');
  fetch('/api/library')
    .then(function (r) {
      if (r.status === 401) { showGate(); throw new Error('signed out'); }
      return r.json();
    })
    .then(function (data) {
      state.games = data.games || [];
      state.warnings = data.warnings || [];
      renderTotals();
      renderWarnings();
      renderGames();
    })
    .catch(function (e) {
      if (e.message === 'signed out') return;
      $('#games').innerHTML = '<div class="empty">Could not load your library.<br>' + esc(e.message) + '</div>';
    });
}

function visibleGames() {
  var q = state.query.trim().toLowerCase();

  var list = state.games.filter(function (g) {
    if (state.platform !== 'all' && g.platform !== state.platform) return false;
    if (q && g.name.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });

  var by = {
    name: function (a, b) { return a.name.localeCompare(b.name); },
    played: function (a, b) { return (b.minutesPlayed || 0) - (a.minutesPlayed || 0); },
    recent: function (a, b) { return (b.lastPlayed || 0) - (a.lastPlayed || 0); },
    progress: function (a, b) {
      var pa = progressOf(a);
      var pb = progressOf(b);
      return (pb && pb.percent !== null ? pb.percent : -1) -
             (pa && pa.percent !== null ? pa.percent : -1);
    }
  };

  return list.sort(by[state.sort] || by.recent);
}

function renderTotals() {
  var steam = 0, xbox = 0, gs = 0;
  state.games.forEach(function (g) {
    if (g.platform === 'steam') steam++; else xbox++;
    if (g.summary && g.summary.points) gs += g.summary.points;
  });

  var bits = [];
  bits.push('<div class="stat"><b>' + state.games.length + '</b><i>Games</i></div>');
  if (steam) bits.push('<div class="stat"><b>' + steam + '</b><i>Steam</i></div>');
  if (xbox) bits.push('<div class="stat"><b>' + xbox + '</b><i>Xbox</i></div>');
  if (gs) bits.push('<div class="stat"><b>' + gs.toLocaleString() + '</b><i>Gamerscore</i></div>');

  $('#totals').innerHTML = bits.join('');
}

// A platform can fail while the other still returns games, so these must show
// whether or not the list is empty.
function renderWarnings() {
  if (!state.warnings.length) {
    $('#warnings').innerHTML = '';
    return;
  }
  $('#warnings').innerHTML = state.warnings.map(function (w) {
    return '<div class="warn">' + esc(w) + '</div>';
  }).join('');
}

function renderGames() {
  var list = visibleGames();
  var box = $('#games');

  if (!list.length) {
    var msg = state.games.length
      ? 'No games match that.'
      : (state.warnings.length ? state.warnings.map(esc).join('<br><br>') : 'No games found.');
    box.innerHTML = '<div class="empty">' + msg + '</div>';
    return;
  }

  box.innerHTML = list.map(function (g) {
    var key = g.platform + ':' + g.id;
    var sub = [];
    var played = hours(g.minutesPlayed);
    if (played) sub.push(esc(played));
    else if (g.lastPlayed) sub.push(esc(when(g.lastPlayed)));

    var bar = '';
    var prog = progressOf(g);
    if (prog) {
      sub.push(prog.label);
      if (prog.percent !== null) {
        bar = '<div class="mini-bar' + (prog.percent === 100 ? ' done' : '') + '">' +
          '<i style="width:' + prog.percent + '%"></i></div>';
      }
    }

    return '<button class="game" data-key="' + esc(key) + '"' +
      (state.selected === key ? ' aria-current="true"' : '') + '>' +
      (g.art
        ? '<img class="thumb" src="' + esc(g.art) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
        : '<div class="thumb"></div>') +
      '<div style="min-width:0">' +
        '<div class="game-name">' + esc(g.name) + '</div>' +
        '<div class="game-sub"><span class="dot ' + g.platform + '"></span>' + sub.join(' &middot; ') + '</div>' +
        bar +
      '</div></button>';
  }).join('');
}

$('#games').addEventListener('click', function (e) {
  var btn = e.target.closest('.game');
  if (btn) select(btn.getAttribute('data-key'));
});

$('#search').addEventListener('input', function (e) {
  state.query = e.target.value;
  renderGames();
});

$('#sort').addEventListener('change', function (e) {
  state.sort = e.target.value;
  renderGames();
});

Array.prototype.forEach.call(document.querySelectorAll('.chips .chip'), function (chip) {
  chip.addEventListener('click', function () {
    state.platform = chip.getAttribute('data-plat');
    Array.prototype.forEach.call(document.querySelectorAll('.chips .chip'), function (c) {
      c.setAttribute('aria-pressed', String(c === chip));
    });
    renderGames();
  });
});

$('#back').addEventListener('click', function () {
  document.body.classList.remove('viewing');
});

/* ---------------- Game detail ---------------- */

function gameByKey(key) {
  return state.games.filter(function (g) { return g.platform + ':' + g.id === key; })[0];
}

function select(key) {
  var game = gameByKey(key);
  if (!game) return;

  state.selected = key;
  state.filter = 'all';
  state.achSort = 'default';
  document.body.classList.add('viewing');
  renderGames();

  if (state.cache[key]) {
    renderDetail(game, state.cache[key]);
    return;
  }

  $('#detail').innerHTML = renderHero(game, null) + '<div class="spinner"></div>';

  fetch('/api/game?platform=' + encodeURIComponent(game.platform) + '&id=' + encodeURIComponent(game.id))
    .then(function (r) {
      if (r.status === 401) { showGate(); throw new Error('signed out'); }
      return r.json();
    })
    .then(function (data) {
      if (state.selected !== key) return;   // user moved on while this was in flight
      state.cache[key] = data;

      // Steam does not give per-game progress in the library call, so fold in
      // what we just learned and let the sidebar show it from now on. Skipped
      // for a partial list, which would otherwise read as 100% complete.
      if (data.achievements && data.achievements.length && !data.partial) {
        var earned = data.achievements.filter(function (a) { return a.earned; }).length;
        game.summary = game.summary || {};
        game.summary.earned = earned;
        game.summary.total = data.achievements.length;
        renderGames();
        renderTotals();
      }

      renderDetail(game, data);
    })
    .catch(function (e) {
      if (e.message === 'signed out') return;
      $('#detail').innerHTML = renderHero(game, null) +
        '<div class="notice">Could not load achievements. ' + esc(e.message) + '</div>';
    });
}

function renderHero(game, data) {
  var label = game.platform === 'steam' ? 'Steam' : 'Xbox';
  var sub = '';

  if (data && data.achievements && data.achievements.length) {
    var all = data.achievements;
    var earned = all.filter(function (a) { return a.earned; });

    var points = 0, totalPoints = 0;
    all.forEach(function (a) {
      if (typeof a.points === 'number') {
        totalPoints += a.points;
        if (a.earned) points += a.points;
      }
    });

    if (data.partial) {
      // Only the unlocked ones came back, so there is no honest denominator.
      // The library summary still has real gamerscore totals, so use those.
      var s = game.summary || {};
      sub = '<div class="progress-row">' +
        '<div class="stat"><b>' + earned.length + '</b><i>Unlocked</i></div>' +
        (s.totalPoints
          ? '<div class="stat"><b>' + (s.points || 0).toLocaleString() + ' / ' +
            s.totalPoints.toLocaleString() + '</b><i>Gamerscore</i></div>'
          : '<div class="stat"><b>' + points.toLocaleString() + '</b><i>Gamerscore</i></div>') +
        '</div>';
    } else {
      var p = pct(earned.length, all.length);
      sub = '<div class="progress-row">' +
        '<div class="bar' + (p === 100 ? ' done' : '') + '"><i style="width:' + p + '%"></i></div>' +
        '<div class="stat"><b>' + earned.length + ' / ' + all.length + '</b><i>' + p + '% complete</i></div>' +
        (totalPoints
          ? '<div class="stat"><b>' + points.toLocaleString() + ' / ' + totalPoints.toLocaleString() +
            '</b><i>Gamerscore</i></div>'
          : '') +
        '</div>';
    }
  }

  var played = hours(game.minutesPlayed);

  return '<div class="hero">' +
    (game.art ? '<div class="hero-art" style="background-image:url(' + esc(game.art) + ')"></div>' : '') +
    '<div class="hero-inner">' +
      '<div class="badge"><span class="dot ' + game.platform + '"></span>' + label +
        (played ? ' &middot; ' + esc(played) + ' played' : '') + '</div>' +
      '<h2>' + esc(game.name) + '</h2>' +
      sub +
    '</div></div>';
}

function renderDetail(game, data) {
  var all = data.achievements || [];

  if (!all.length) {
    $('#detail').innerHTML = renderHero(game, data) +
      '<div class="notice">' + esc(data.note || 'No achievements for this game.') + '</div>';
    return;
  }

  var earnedCount = all.filter(function (a) { return a.earned; }).length;

  // With a partial list every entry is unlocked, so the filters have nothing
  // to divide and would only imply the locked ones are absent by choice.
  var toolbar = '<div class="toolbar">' +
    (data.partial ? '<button class="chip" aria-pressed="true">' + earnedCount + ' unlocked</button>' :
      '<button class="chip" data-filter="all" aria-pressed="' + (state.filter === 'all') + '">All ' + all.length + '</button>' +
      '<button class="chip" data-filter="earned" aria-pressed="' + (state.filter === 'earned') + '">Unlocked ' + earnedCount + '</button>' +
      '<button class="chip" data-filter="locked" aria-pressed="' + (state.filter === 'locked') + '">Locked ' + (all.length - earnedCount) + '</button>') +
    '<select id="ach-sort">' +
      '<option value="default"' + (state.achSort === 'default' ? ' selected' : '') + '>Unlocked first</option>' +
      '<option value="recent"' + (state.achSort === 'recent' ? ' selected' : '') + '>Most recent</option>' +
      '<option value="rarity"' + (state.achSort === 'rarity' ? ' selected' : '') + '>Rarest first</option>' +
      '<option value="name"' + (state.achSort === 'name' ? ' selected' : '') + '>Name</option>' +
    '</select>' +
    '</div>';

  var caveat = data.note ? '<div class="notice">' + esc(data.note) + '</div>' : '';
  $('#detail').innerHTML = renderHero(game, data) + toolbar + caveat + '<div id="list"></div>';

  $('#detail').querySelectorAll('.toolbar .chip[data-filter]').forEach(function (chip) {
    chip.addEventListener('click', function () {
      state.filter = chip.getAttribute('data-filter');
      renderDetail(game, data);
      $('#detail').scrollTop = 0;
    });
  });

  $('#ach-sort').addEventListener('change', function (e) {
    state.achSort = e.target.value;
    renderDetail(game, data);
  });

  renderList(all);
}

function renderList(all) {
  var rows = all.filter(function (a) {
    if (state.filter === 'earned') return a.earned;
    if (state.filter === 'locked') return !a.earned;
    return true;
  });

  var sorters = {
    // Unlocked first, newest unlock at the top, then everything still locked.
    default: function (a, b) {
      if (a.earned !== b.earned) return a.earned ? -1 : 1;
      if (a.earned) return (b.unlockedAt || 0) - (a.unlockedAt || 0);
      return a.name.localeCompare(b.name);
    },
    recent: function (a, b) { return (b.unlockedAt || 0) - (a.unlockedAt || 0); },
    rarity: function (a, b) {
      var ra = a.rarity == null ? 101 : a.rarity;
      var rb = b.rarity == null ? 101 : b.rarity;
      return ra - rb;
    },
    name: function (a, b) { return a.name.localeCompare(b.name); }
  };

  rows = rows.slice().sort(sorters[state.achSort] || sorters.default);

  if (!rows.length) {
    $('#list').innerHTML = '<div class="empty">Nothing here.</div>';
    return;
  }

  $('#list').innerHTML = rows.map(function (a) {
    var meta = [];
    var date = when(a.unlockedAt);
    if (a.earned && date) meta.push('<div class="date">' + esc(date) + '</div>');
    else if (a.earned) meta.push('<div class="date">Unlocked</div>');

    if (typeof a.points === 'number' && a.points > 0) {
      meta.push('<div class="gs">' + a.points + ' G</div>');
    }
    if (a.rarity != null) {
      meta.push('<div class="rarity ' + rarityClass(a.rarity) + '">' +
        (a.rarity < 1 ? a.rarity.toFixed(2) : a.rarity.toFixed(1)) + '%</div>');
    }

    // A secret the player has not earned yet keeps its description hidden.
    var hideDesc = a.secret && !a.earned;

    return '<div class="ach' + (a.earned ? '' : ' locked') + '">' +
      (a.icon
        ? '<img class="ach-icon" src="' + esc(a.icon) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
        : '<div class="ach-icon"></div>') +
      '<div style="min-width:0">' +
        '<div class="ach-name">' + esc(a.name) +
          (a.secret ? '<span class="secret-tag">Secret</span>' : '') + '</div>' +
        '<div class="ach-desc">' + (hideDesc ? '<em>Hidden until unlocked</em>' : esc(a.description)) + '</div>' +
      '</div>' +
      '<div class="ach-meta">' + meta.join('') + '</div>' +
    '</div>';
  }).join('');
}

/* ---------------- Boot ---------------- */

if (AUTHED) start(); else showGate();
</script>
</body>
</html>
